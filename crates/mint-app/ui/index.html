<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>mint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-label="mint password generator">
    <header class="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <svg class="leaf" viewBox="0 0 36 36" aria-hidden="true"><path d="M9.5 26.5C8.6 16.4 15.8 9.8 27.5 8.5 27 19.4 19.6 26.8 9.5 26.5Z"/><path class="rib" d="M11.2 24.8 24.6 11.4"/><path class="stem" d="M9.6 26.4 6.6 29.4"/></svg>
        <span data-tauri-drag-region>mint</span>
      </div>
      <label class="preset-picker">
        <span class="visually-hidden">Preset</span>
        <select id="preset" title="Preset (⌘P)">
          <option value="">Custom</option>
        </select>
      </label>
    </header>

    <section class="output">
      <button id="password" class="password" type="button" title="Copy (Enter)" aria-label="Password. Press Enter to copy."></button>
      <div class="meta">
        <div class="strength" id="strength" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <span id="bits" class="bits"></span>
        <span id="summary" class="summary"></span>
      </div>
    </section>

    <section class="controls">
      <div class="segmented" role="radiogroup" aria-label="Kind">
        <button type="button" role="radio" data-kind="chars">Characters</button>
        <button type="button" role="radio" data-kind="words">Passphrase</button>
        <button type="button" role="radio" data-kind="pin">PIN</button>
      </div>

      <div class="row">
        <label for="length-slider" id="length-label" class="label">Length</label>
        <input id="length-slider" type="range" min="4" max="128" step="1">
        <input id="length" class="number" type="number" min="1" max="4096" step="1" aria-labelledby="length-label">
      </div>

      <div class="row chars-only">
        <span class="label">Use</span>
        <div class="toggles" role="group" aria-label="Character classes">
          <button type="button" class="toggle" data-class="upper" title="Uppercase A–Z">A–Z</button>
          <button type="button" class="toggle" data-class="lower" title="Lowercase a–z">a–z</button>
          <button type="button" class="toggle" data-class="digits" title="Digits 0–9">0–9</button>
          <button type="button" class="toggle" data-class="symbols" title="Symbols">#$&amp;</button>
        </div>
      </div>

      <div class="row chars-only">
        <label for="symbol-set" class="label">Symbols</label>
        <input id="symbol-set" class="text mono" type="text" spellcheck="false" autocomplete="off" autocapitalize="off">
        <button type="button" class="toggle small" id="no-ambiguous" title="Leave out 0 O o 1 l I |">No look-alikes</button>
      </div>

      <div class="row words-only">
        <label for="separator" class="label">Between</label>
        <select id="separator">
          <option value="-">hyphen  -</option>
          <option value=" ">space</option>
          <option value=".">period  .</option>
          <option value="_">underscore  _</option>
          <option value=",">comma  ,</option>
          <option value="">nothing</option>
        </select>
        <button type="button" class="toggle small" id="capitalize">Capitalize</button>
        <button type="button" class="toggle small" id="word-digit">Add digit</button>
      </div>
    </section>

    <section class="actions">
      <button type="button" id="regenerate" class="button ghost" title="Regenerate (⌘R)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.76-4.24M16 4v3.5h-3.5"/></svg>
        <span>Regenerate</span><kbd class="mod">R</kbd>
      </button>
      <button type="button" id="open-save" class="button ghost" title="Save to 1Password (⌘S)">
        <span>Save to 1Password</span><kbd class="mod">S</kbd>
      </button>
      <button type="button" id="copy" class="button primary" title="Copy and hide (Enter)">
        <span>Copy</span><kbd>↵</kbd>
      </button>
    </section>

    <form id="save-panel" class="save-panel" hidden autocomplete="off">
      <div class="field">
        <label for="title">Title</label>
        <input id="title" type="text" required placeholder="Site or service" spellcheck="false">
      </div>
      <div class="field">
        <label for="vault">Vault</label>
        <select id="vault"><option value="">Loading vaults…</option></select>
      </div>
      <div class="field">
        <label for="url">Website</label>
        <input id="url" type="url" placeholder="https://example.com" spellcheck="false" autocapitalize="off">
      </div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="optional" spellcheck="false" autocapitalize="off">
      </div>
      <div class="save-actions">
        <button type="button" id="cancel-save" class="button ghost">Cancel <kbd>esc</kbd></button>
        <button type="submit" id="save" class="button primary">Save <kbd class="mod">S</kbd></button>
      </div>
    </form>

    <footer class="status">
      <span id="status" role="status" aria-live="polite"></span>
      <span id="hint" class="hint"></span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
