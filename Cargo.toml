[workspace]
resolver = "3"
members = ["crates/mint-core", "crates/mint-cli", "crates/mint-app"]
default-members = ["crates/mint-core", "crates/mint-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/steveclarke/mint"
rust-version = "1.85"

[workspace.dependencies]
mint-core = { path = "crates/mint-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Stripping proc-macro dylibs on macOS leaves rustc unable to load them
# (`can't find crate for ctor_proc_macro`).
[profile.release.build-override]
strip = false
